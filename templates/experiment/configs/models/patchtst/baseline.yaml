# Toolkit baseline for patchtst — a generic CGM-only starting point.
# Copy into your experiment's configs/models/ and tune from here.
model_type: patchtst
training_mode: from_scratch
context_length: 512
forecast_length: 96
patch_len: 16
stride: 8
d_model: 128
nhead: 16
num_encoder_layers: 3
lr: 0.0001
weight_decay: 1e-08
num_batches_per_epoch: 100
batch_size: 256
max_epochs: 100
early_stopping_patience: 20
covariate_cols: []
target_col: bg_mM
patient_col: patient_id
time_col: datetime
interval_mins: 5
eval_metric: WQL
enable_ensemble: false
imputation_threshold_mins: 45
