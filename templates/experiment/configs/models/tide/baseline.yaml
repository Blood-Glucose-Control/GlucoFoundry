# Toolkit baseline for tide — a generic CGM-only starting point.
# Copy into your experiment's configs/models/ and tune from here.
model_type: tide
training_mode: from_scratch
context_length: 512
forecast_length: 96
encoder_hidden_dim: 256
decoder_hidden_dim: 256
temporal_hidden_dim: 256
num_layers_encoder: 2
num_layers_decoder: 2
distr_hidden_dim: 8
dropout: 0.1
scaling: mean
lr: 0.000931
num_batches_per_epoch: 300
batch_size: 256
gradient_clip_val: 1.0
precision: 16-mixed
imputation_threshold_mins: 45
covariate_cols: []
target_col: bg_mM
patient_col: patient_id
time_col: datetime
interval_mins: 5
eval_metric: WQL
enable_ensemble: false
time_limit: 1800
