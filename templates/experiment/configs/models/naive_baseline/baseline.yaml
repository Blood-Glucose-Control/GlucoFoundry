# Toolkit baseline for naive_baseline — a generic CGM-only starting point.
# Copy into your experiment's configs/models/ and tune from here.
model_type: naive_baseline
training_mode: from_scratch
model_name: Naive
context_length: 512
forecast_length: 96
covariate_cols: []
target_col: bg_mM
patient_col: patient_id
time_col: datetime
interval_mins: 5
eval_metric: WQL
enable_ensemble: false
imputation_threshold_mins: 45
