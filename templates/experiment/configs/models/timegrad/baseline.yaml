# Toolkit baseline for timegrad — a generic CGM-only starting point.
# Copy into your experiment's configs/models/ and tune from here.
training_mode: from_scratch
num_epochs: 10
input_features: []
target_features:
- bg_mM
scaler_type: standard
resolution_min: 5
split_config:
  train: 0.9
  val: 0.05
  test: 0.05
diff_steps: 10
beta_end: 0.1
beta_schedule: linear
loss_type: l2
cell_type: GRU
num_cells: 100
num_layers: 2
residual_layers: 8
residual_channels: 8
num_samples: 10
scaling: true
num_batches_per_epoch: 1000
freq: 5T
