# Toolkit baseline for chronos2 — a generic CGM-only starting point.
# Copy into your experiment's configs/models/ and tune from here.
model_path: autogluon/chronos-2
context_length: 512
forecast_length: 96
training_mode: fine_tune
freeze_backbone: false
fine_tune_steps: 10000
fine_tune_lr: 1.0e-05
fine_tune_batch_size: 256
fine_tune_logging_steps: 500
checkpoint_save_steps: 2000
covariate_cols: []
target_col: bg_mM
patient_col: patient_id
time_col: datetime
interval_mins: 5
eval_metric: WQL
enable_ensemble: false
