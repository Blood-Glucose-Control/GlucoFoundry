site_name: GlucoFoundry
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - search.highlight

plugins:
  - search
  - include-markdown

nav:
  - Home: index.md
  - Architecture:
      - Toolkit Architecture: architecture/toolkit-architecture.md
      - Repository Design Handbook: architecture/repository-design-handbook.md
      - Research Workflows: architecture/workflows.md
      - Base Model Framework: base_model_framework_README.md
      - Workflow Config Schemas: architecture/workflow-configs-schema-guide.md
      - Config Schema Artifacts: architecture/config-schema-artifacts.md
      - Model Implementation Quality Checklist: architecture/model-implementation-quality-checklist.md
  - User Guide:
      - Getting Started: user-guide/getting-started.md
      - Example Scripts: user-guide/example-scripts-guide.md
      - Data:
        - Data Preparation: user-guide/datasets/data-preparation.md
        - Cache System: cache-system.md
      - Modeling:
        - Model Training: user-guide/modeling/model-training.md
      - Benchmarking:
        - Model Benchmarking: user-guide/benchmarking/model-benchmarking.md
  - Contributing: contributing.md
markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
