# =============================================================================
# Toto — Smoke Test Configuration (BG + IOB, 100 steps)
# =============================================================================
# Fast end-to-end validation of the covariate path.
# Exercises the IOB exogenous-variable pipeline.
#
# Usage:
#   CUDA_VISIBLE_DEVICES=0 MODEL_TYPE="toto" \
#   MODEL_CONFIG="experiments/nocturnal/configs/models/toto/bg_iob_smoke_test.yaml" \
#   CONFIG_DIR="configs/data/holdout_10pct" \
#   DATASETS="aleppo_2017" \
#   SKIP_TRAINING="false" SKIP_STEPS="7" \
#     python scripts/workflows/forecasting/forecasting_workflow_orchestrator.py --model-type "$MODEL_TYPE" --model-config "$MODEL_CONFIG" --datasets $DATASETS
# =============================================================================

context_length: 512
forecast_length: 96

training_mode: "fine_tune"
freeze_backbone: false

max_steps: 100
lr: 1.0e-4
min_lr: 1.0e-5
warmup_steps: 20
stable_steps: 40
decay_steps: 40

train_batch_size: 4
val_batch_size: 1

covariate_cols: [iob]
